# Config file for Mystical Ninja Starring Goemon (USA) Recompilation.

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
relocatable_sections_path = "mnsg.overlays.txt"
symbols_file_path = "Goemon64RecompSyms/mnsg.syms.toml"
rom_file_path = "mnsg.z64"
trace_mode = true
bss_section_suffix = "_bss"

[patches]
stubs = [

]

ignored = [
]

# When osAiGetLength returns a number that exceeds the target amount of samples per frame, the calculation (target samples per frame - osAiGetLength()) will result in a negative number.
# When the clamping takes place to prevent a number of bytes that is too small, it doesn't take into account the negative number that resulted from the calculation.
# Not doing this results in a negative number being given to osAiSetNextBuffer causing a massive memory leak and crash (because a signed negative number is being read as unsigned).
[[patches.instruction]]
func = "func_80038210_38E10"
vram = 0x80038290
value = 0x00E3082A # sltu $at, $a3, $v1 -> slt $at, $a3, $v1

# Impact battles (file_13) render inside the N64 4:3 safe area even in widescreen.
# They do NOT take the Camera-struct scissor that patches/anime.c widens -- file_13
# emits its own gDPSetScissor from func_801D2178_5FD558, which picks a hardcoded
# default rect (10,14)-(310,224) when D_8020EED0->0x2C0 is zero and then CLAMPS
# x to [10,310] and y to [14,224]. Because the clamp runs on both branches,
# writing the custom-rect fields from a patch cannot widen it -- the bounds
# themselves have to move. Measured on device before the change: the rendered
# image occupied exactly x 10..310, y 14..224 of the (already widescreen)
# framebuffer, i.e. a uniform inset border on all four sides.
#
# These 24 edits move the default rect and both clamp bounds to the full frame.
# The sltiu comparisons appear TWICE each because the compiler duplicated the
# next comparison into a branch-likely delay slot; both copies must agree.
#
# UNCONDITIONAL: an instruction patch cannot read the aspect-ratio setting, so
# 4:3 also loses the safe-area inset. Accepted deliberately -- there is no
# overscan on a modern panel.

[[patches.instruction]]
func = "func_801D2178_5FD558"
vram = 0x801D21C0
value = 0x24040000 # li $a0, 10 -> 0    default scissor ulx

[[patches.instruction]]
func = "func_801D2178_5FD558"
vram = 0x801D21C4
value = 0x24050000 # li $a1, 14 -> 0    default scissor uly

[[patches.instruction]]
func = "func_801D2178_5FD558"
vram = 0x801D21C8
value = 0x24060140 # li $a2, 310 -> 320 default scissor lrx

[[patches.instruction]]
